x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

services:
  postgres:
    logging: *bounded-logging
    restart: unless-stopped
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricetoken}
      POSTGRES_USER: ${POSTGRES_USER:-pricetoken}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pricetoken}']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    logging: *bounded-logging
    restart: unless-stopped
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    logging: *bounded-logging
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 2048m
    pids_limit: 512
    build:
      context: .
      dockerfile: Dockerfile
    # Built from this checkout unless an image is named. The deploy names
    # one, so the server pulls what CI built instead of spending its disk on
    # a build cache and a layer of every intermediate image.
    image: ${PRICETOKEN_IMAGE:-pricetoken-web}:${PRICETOKEN_IMAGE_TAG:-local}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /home/sotto/.claude:/home/node/.claude
      - analytics-data:/app/data
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pricetoken}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pricetoken}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      CLAUDE_CODE_ENABLED: ${CLAUDE_CODE_ENABLED:-}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET required}
      ANALYTICS_INTERNAL_SECRET: ${ANALYTICS_INTERNAL_SECRET:-pt-analytics-internal}
      PORT: '3001'
volumes:
  pgdata:
  analytics-data:
