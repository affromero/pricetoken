name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The image used to be built on the production box, which cost it a build
  # cache and a layer of every intermediate image on a disk shared with nine
  # other projects. A runner builds it now; the box only pulls.
  image:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          # Compose insists on these at parse time; a build never reads them.
          POSTGRES_PASSWORD: build-time-placeholder
          ANTHROPIC_API_KEY: build-time-placeholder
          CRON_SECRET: build-time-placeholder
          ADMIN_PASSWORD: build-time-placeholder
          ADMIN_SESSION_SECRET: build-time-placeholder
        run: |
          SHA=$(git rev-parse --short HEAD)
          export PRICETOKEN_IMAGE="ghcr.io/${OWNER}/pricetoken-web"
          export PRICETOKEN_IMAGE_TAG="$SHA"
          # Built through compose so the image is named what it will be
          # pushed as — no retag step to get wrong.
          docker compose -f docker-compose.prod.yml build web
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "${PRICETOKEN_IMAGE}:${SHA}"
          docker tag "${PRICETOKEN_IMAGE}:${SHA}" "${PRICETOKEN_IMAGE}:main"
          docker push "${PRICETOKEN_IMAGE}:main"
          echo "tag=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Production
    needs: image
    runs-on: ubuntu-latest
    outputs:
      deploy_status: ${{ steps.deploy.outcome }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch secrets from Infisical
        run: |
          AT=$(curl -sS -X POST https://app.infisical.com/api/v1/auth/universal-auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken // empty')
          [ -n "$AT" ] || { echo "Infisical login failed"; exit 1; }
          ENV_B64=$(curl -sS -H "Authorization: Bearer $AT" \
            "https://app.infisical.com/api/v3/secrets/raw?workspaceId=730076b1-5f72-4691-b271-139dc721529e&environment=prod&secretPath=%2F" \
            | jq -r '.secrets[] | "\(.secretKey)=\(.secretValue|@json)"' | base64 -w0)
          [ -n "$ENV_B64" ] || { echo "Infisical returned no secrets"; exit 1; }
          echo "::add-mask::$ENV_B64"
          echo "ENV_B64=$ENV_B64" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          PRICETOKEN_IMAGE: ghcr.io/${{ github.repository_owner }}/pricetoken-web
          PRICETOKEN_IMAGE_TAG: ${{ needs.image.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: ENV_B64,PRICETOKEN_IMAGE,PRICETOKEN_IMAGE_TAG
          script: |
            set -e
            cd ~/pricetoken

            echo "Pulling latest code..."
            git checkout -- .
            git clean -fd
            git pull origin main

            echo "Syncing Caddy config..."
            sudo cp ~/pricetoken/Caddyfile /etc/caddy/conf.d/pricetoken.ai
            sudo caddy reload --config /etc/caddy/Caddyfile --force

            echo "Generating .env from Infisical..."
            umask 077
            echo "$ENV_B64" | base64 -d > ~/pricetoken/.env
            test -s ~/pricetoken/.env || { echo "FATAL: .env is empty"; exit 1; }

            echo "Writing systemd env file..."
            # Reuse the already-decoded .env instead of a second vault call.
            # Values are JSON-quoted in .env; strip the wrapping quotes so the
            # systemd unit does not inherit them.
            mkdir -p ~/.config/pricetoken
            grep -m1 '^CRON_SECRET=' ~/pricetoken/.env \
              | sed 's/^CRON_SECRET="\(.*\)"$/CRON_SECRET=\1/' > ~/.config/pricetoken/env
            grep -q '^CRON_SECRET=.' ~/.config/pricetoken/env || { echo "FATAL: CRON_SECRET missing or empty"; exit 1; }
            chmod 600 ~/.config/pricetoken/env

            echo "Pulling the published image..."
            export PRICETOKEN_IMAGE PRICETOKEN_IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull web

            echo "Starting infra services..."
            docker compose -f docker-compose.prod.yml up -d --no-recreate postgres redis

            echo "Syncing postgres password with .env..."
            source ~/pricetoken/.env
            PG_USER="${POSTGRES_USER:-pricetoken}"
            printf "ALTER USER %s WITH PASSWORD '%s';\n" "$PG_USER" "$POSTGRES_PASSWORD" | \
              docker compose -f docker-compose.prod.yml exec -T postgres psql -U "$PG_USER"

            echo "Waiting for postgres to accept connections..."
            for i in $(seq 1 15); do
              if docker compose -f docker-compose.prod.yml exec -T postgres pg_isready -U "${PG_USER}" -q 2>/dev/null; then
                echo "Postgres ready (attempt $i)"
                break
              fi
              echo "Attempt $i/15 — postgres not ready"
              sleep 2
              if [ "$i" -eq 15 ]; then
                echo "Postgres failed to start after 30s"
                exit 1
              fi
            done

            echo "Running Prisma migrations..."
            for i in $(seq 1 3); do
              if docker compose -f docker-compose.prod.yml run --rm --no-deps web npx prisma db push --schema=apps/web/prisma/schema.prisma; then
                echo "Prisma migrations applied (attempt $i)"
                break
              fi
              echo "Prisma attempt $i/3 failed — retrying in 5s..."
              sleep 5
              if [ "$i" -eq 3 ]; then
                echo "Prisma migrations failed after 3 attempts"
                exit 1
              fi
            done

            echo "Restarting web..."
            docker compose -f docker-compose.prod.yml up -d --no-build --force-recreate --no-deps --remove-orphans web

            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 10
              HEALTH=$(curl -sf http://localhost:3001/api/health 2>/dev/null || echo "")
              if [ -n "$HEALTH" ]; then
                echo "Health check passed (attempt $i): $HEALTH"
                break
              fi
              echo "Attempt $i/12 — not ready yet"
              if [ "$i" -eq 12 ]; then
                echo "Health check failed after 120s"
                docker compose -f docker-compose.prod.yml logs --tail=50 web
                exit 1
              fi
            done

            echo "Seeding new models..."
            docker compose -f docker-compose.prod.yml exec web npx tsx scripts/seed.ts
            docker compose -f docker-compose.prod.yml exec web npx tsx scripts/seed-video.ts
            docker compose -f docker-compose.prod.yml exec web npx tsx scripts/seed-avatar.ts
            docker compose -f docker-compose.prod.yml exec web npx tsx scripts/seed-tts.ts
            docker compose -f docker-compose.prod.yml exec web npx tsx scripts/seed-stt.ts
            docker compose -f docker-compose.prod.yml exec web npx tsx scripts/seed-music.ts

            echo "Syncing systemd timer..."
            chmod +x ~/pricetoken/infra/fetch-all-pricing.sh
            sudo cp ~/pricetoken/infra/pricetoken-fetch.service /etc/systemd/system/
            sudo cp ~/pricetoken/infra/pricetoken-fetch.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now pricetoken-fetch.timer

            echo "Cleaning up old images..."
            # -a, or the superseded tag from each deploy is never reclaimed.
            docker image prune -af --filter "until=168h"

            echo "Deploy complete!"

  notify:
    name: Telegram Notification
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Notify via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ needs.deploy.outputs.deploy_status || needs.deploy.result }}
        run: |
          COMMIT_MSG=$(git log -1 --format='%s')
          COMMIT_SHA=$(git log -1 --format='%h')
          PREV_SHA=$(git log -1 --format='%h' HEAD~1)
          AUTHOR=$(git log -1 --format='%an')

          if [ "$DEPLOY_STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS="deployed"
          else
            EMOJI="❌"
            STATUS="deploy failed"
          fi

          HEALTH_LINE=""
          if [ "$DEPLOY_STATUS" = "success" ]; then
            HEALTH=$(curl -sf --max-time 5 "https://pricetoken.ai/api/health" 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              HEALTH_LINE="Health: ✅ live"
            else
              HEALTH_LINE="Health: ⚠️ unreachable"
            fi
          fi

          NL=$'\n'
          TEXT="${EMOJI} <b>pricetoken.ai ${STATUS}</b>${NL}"
          TEXT="${TEXT}<code>${PREV_SHA}</code> → <code>${COMMIT_SHA}</code>  <i>${COMMIT_MSG}</i>${NL}"
          TEXT="${TEXT}by ${AUTHOR}"

          [ -n "$HEALTH_LINE" ] && TEXT="${TEXT}${NL}${NL}<blockquote>${HEALTH_LINE}</blockquote>"

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="${TEXT}${NL}<a href=\"https://pricetoken.ai\">pricetoken.ai</a>  ·  <a href=\"${RUN_URL}\">Run</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
