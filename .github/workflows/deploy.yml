name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Build and Verify Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      expanded: ${{ steps.build.outputs.expanded }}
      compressed: ${{ steps.build.outputs.compressed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build, smoke-test and publish
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER,,}/pricetoken-web:$REVISION"
          python3 -m unittest discover -s scripts -p 'test_image_tools.py' -v
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$REVISION" -t "$IMAGE" .
          bash scripts/smoke-image.sh "$IMAGE"
          python3 scripts/measure-image.py "$IMAGE" > image-size.json
          expanded=$(jq -er '.expanded_bytes' image-size.json)
          compressed=$(jq -er '.compressed_bytes' image-size.json)
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          [[ $digest =~ @sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "expanded=$expanded" >> "$GITHUB_OUTPUT"
          echo "compressed=$compressed" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Verified Image
    needs: image
    runs-on: ubuntu-latest
    outputs:
      deploy_status: ${{ steps.deploy.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      # Only small committed assets are transferred before the runner acquires
      # the host lock. All image pulls happen inside its capacity checks.
      - name: Transfer release assets
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: docker-compose.prod.yml,scripts/deploy-image.sh,scripts/retain-deployments.py
          target: ~/pricetoken/.releases/${{ github.sha }}
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_IMAGE: ${{ needs.image.outputs.digest }}
          IMAGE_BYTES: ${{ needs.image.outputs.expanded }}
          TRANSFER_BYTES: ${{ needs.image.outputs.compressed }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          envs: RELEASE_SHA,RELEASE_IMAGE,IMAGE_BYTES,TRANSFER_BYTES
          script: |
            set -eu
            bash "$HOME/pricetoken/.releases/$RELEASE_SHA/scripts/deploy-image.sh" \
              "$HOME/pricetoken" "$RELEASE_SHA" "$RELEASE_IMAGE" \
              "$IMAGE_BYTES" "$TRANSFER_BYTES" https://pricetoken.ai/api/health

  notify:
    name: Telegram Notification
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Notify via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ needs.deploy.outputs.deploy_status || needs.deploy.result }}
        run: |
          COMMIT_MSG=$(git log -1 --format='%s')
          COMMIT_SHA=$(git log -1 --format='%h')
          PREV_SHA=$(git log -1 --format='%h' HEAD~1)
          AUTHOR=$(git log -1 --format='%an')

          if [ "$DEPLOY_STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS="deployed"
          else
            EMOJI="❌"
            STATUS="deploy failed"
          fi

          HEALTH_LINE=""
          if [ "$DEPLOY_STATUS" = "success" ]; then
            HEALTH=$(curl -sf --max-time 5 "https://pricetoken.ai/api/health" 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              HEALTH_LINE="Health: ✅ live"
            else
              HEALTH_LINE="Health: ⚠️ unreachable"
            fi
          fi

          NL=$'\n'
          TEXT="${EMOJI} <b>pricetoken.ai ${STATUS}</b>${NL}"
          TEXT="${TEXT}<code>${PREV_SHA}</code> → <code>${COMMIT_SHA}</code>  <i>${COMMIT_MSG}</i>${NL}"
          TEXT="${TEXT}by ${AUTHOR}"

          [ -n "$HEALTH_LINE" ] && TEXT="${TEXT}${NL}${NL}<blockquote>${HEALTH_LINE}</blockquote>"

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="${TEXT}${NL}<a href=\"https://pricetoken.ai\">pricetoken.ai</a>  ·  <a href=\"${RUN_URL}\">Run</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
